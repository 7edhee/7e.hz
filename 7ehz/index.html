<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>7e.hz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════════════════════════════════════
     SCREEN 1 — SPLASH
══════════════════════════════════════════ -->
<div class="screen active" id="screen-splash">
  <div class="splash-bg"></div>

  <!-- floating vinyl records -->
  <div class="splash-art">
    <div class="vinyl v1">
      <div class="vinyl-disc">
        <div class="vinyl-label"></div>
        <div class="vinyl-grooves"></div>
      </div>
    </div>
    <div class="vinyl v2">
      <div class="vinyl-disc">
        <div class="vinyl-label"></div>
        <div class="vinyl-grooves"></div>
      </div>
    </div>
    <div class="cassette">
      <div class="cassette-body">
        <div class="cassette-window">
          <div class="reel r-left"></div>
          <div class="reel r-right"></div>
        </div>
        <div class="cassette-label">
          <span class="cassette-label-b">B</span>
          <span class="cassette-label-type">TYPE I / IEC I / NORM</span>
        </div>
        <div class="cassette-counter">90</div>
      </div>
    </div>
  </div>

  <div class="splash-text">
    <h1 class="splash-headline">
      <span>New</span>
      <span>Age Of</span>
      <span>Music</span>
    </h1>
  </div>

  <div class="splash-bottom">
    <button class="btn-get-started" id="btn-start">Get Started</button>
  </div>
</div>


<!-- ══════════════════════════════════════════
     SCREEN 2 — EXPLORE
══════════════════════════════════════════ -->
<div class="screen" id="screen-explore">
  <div class="screen-header">
    <h2 class="screen-title">Explore</h2>
    <button class="icon-btn" aria-label="More">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </div>

  <!-- search -->
  <div class="search-bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="search-input" placeholder="Artists, tracks, genres…">
  </div>

  <!-- floating / scrolling track list -->
  <div class="track-list" id="track-list">
    <div class="track-list-loading" id="list-loading">
      <div class="loader-ring"></div>
    </div>
  </div>

  <!-- bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-item" aria-label="Home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
    </button>
    <button class="nav-item active" aria-label="Explore">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24,7.76 14.12,14.12 7.76,16.24 9.88,9.88"/></svg>
    </button>
    <button class="nav-item" aria-label="Saved">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    </button>
  </nav>
</div>


<!-- ══════════════════════════════════════════
     SCREEN 3 — NOW PLAYING
══════════════════════════════════════════ -->
<div class="screen" id="screen-player">
  <div class="player-header">
    <button class="icon-btn" id="btn-back" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,18 9,12 15,6"/></svg>
    </button>
    <button class="icon-btn" aria-label="More">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </div>

  <!-- Turntable -->
  <div class="turntable-wrap">
    <div class="turntable-platter">
      <div class="turntable-vinyl" id="turntable-vinyl">
        <div class="tv-grooves"></div>
        <div class="tv-label" id="tv-label"></div>
      </div>
    </div>
    <div class="turntable-arm" id="turntable-arm"></div>
    <!-- tone arm pivot buttons -->
    <div class="arm-pivot-left"></div>
    <div class="arm-pivot-right"></div>
  </div>

  <!-- track info -->
  <div class="player-info">
    <div class="pi-title" id="pi-title">Select a track</div>
    <div class="pi-artist" id="pi-artist">—</div>
  </div>

  <!-- waveform (decorative animated) -->
  <div class="waveform" id="waveform">
    <div class="wf-bars">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <!-- progress -->
  <div class="player-progress">
    <div class="prog-bar" id="prog-bar">
      <div class="prog-fill" id="prog-fill"></div>
      <div class="prog-thumb" id="prog-thumb"></div>
    </div>
    <div class="prog-times">
      <span id="prog-cur">0:00</span>
      <span id="prog-dur">0:00</span>
    </div>
  </div>

  <!-- controls -->
  <div class="player-controls">
    <button class="ctrl-pill" id="btn-prev" aria-label="Previous">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="ctrl-pill play" id="btn-play" aria-label="Play">
      <svg id="ico-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-pill" id="btn-next" aria-label="Next">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
    </button>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script src="app.js"></script>
</body>
</html>
