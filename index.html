<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Audio Visualizer and Player with Spotify API Integration">
    <title>Audio & Music Hub</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Spotify Embed IFrame API -->
    <script src="https://open.spotify.com/embed/iframe-api/v1" async defer></script>
</head>
<body>
    <main class="app-container">
        <header class="header">
            <h1>Music & Audio Player</h1>
        </header>

        <section class="player-card">
            <!-- Spotify Web Player Integration -->
            <div id="embed-iframe"></div>

            <div class="controls">
                <input type="text" id="track-search" placeholder="Search track or enter Spotify URI..." />
                <button id="search-btn" class="btn">Search</button>
            </div>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
